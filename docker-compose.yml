services:
  weaviate:
    image: semitechnologies/weaviate:1.38.2
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure
    environment:
      QUERY_DEFAULTS_LIMIT: "500"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1

  retrieval:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: on-failure
    depends_on:
      - weaviate
    env_file:
      - .env
    environment:
      PORT: "8000"
      DATASTORE: weaviate
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_CLASS: ${WEAVIATE_CLASS:-BPMNProcess}
      CHUNK_SIZE: ${CHUNK_SIZE:-400}
      LOGURU_LEVEL: ${LOGURU_LEVEL:-INFO}

volumes:
  graphdb_data:
  weaviate_data:

